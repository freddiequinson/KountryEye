# Staging site: same server as prod, port 8080, its own backend (8001) and files.
server {
    listen 8080;
    server_name _;

    # Hide the nginx version; cap request size (uploads are at most 25MB)
    server_tokens off;
    client_max_body_size 30m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://api.giphy.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # Keep staging out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        root /var/www/kountryeye-staging/frontend-dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # WebSocket
    }

    # Short receipt links sent by SMS
    location ^~ /r/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Scan results are medical records: only served through the logged-in API
    location ^~ /uploads/scans/ {
        return 404;
    }

    location /uploads/ {
        alias /var/www/kountryeye-staging/backend/uploads/;
        # Uploads are only images; never let the browser run them as pages
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Never serve dotfiles, databases or backups if they end up under a web root
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(db|sqlite|sqlite3|bak|env|py|log)$ { deny all; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
}
